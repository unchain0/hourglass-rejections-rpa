[welcome]
description = "Mensagem de boas-vindas"
other = "Bem-vindo ao Bot RPA Hourglass!"

[welcome_instructions]
description = "Instruções após boas-vindas"
other = "Use /configure para escolher quais seções você deseja receber notificações.\nUse /status para ver suas preferências atuais.\nUse /help para ver todos os comandos disponíveis.\nUse /language para alterar o idioma do bot."

[choose_sections]
description = "Escolha seções para receber notificações"
other = "Escolha as seções para receber notificações:"

[your_preferences]
description = "Preferências do usuário"
other = "Suas preferências:"

[notifications_enabled]
description = "Notificações estão ativadas"
other = "Notificações: Ativado"

[notifications_disabled]
description = "Notificações estão desativadas"
other = "Notificações: Desativado"

[no_sections_selected]
description = "Nenhuma seção selecionada"
other = "Nenhuma seção selecionada. Você não receberá notificações."

[selected_sections]
description = "Cabeçalho da lista de seções selecionadas"
other = "Seções selecionadas:"

[language_select]
description = "Prompt de seleção de idioma"
other = "Selecione seu idioma:"

[language_changed]
description = "Confirmação de mudança de idioma"
other = "✅ Idioma alterado com sucesso!"

[help_commands]
description = "Lista de comandos disponíveis"
other = "Comandos disponíveis:\n/start - Mensagem de boas-vindas\n/configure - Configurar seções de notificação\n/status - Ver preferências atuais\n/language - Alterar idioma\n/help - Mostrar esta mensagem\n/checknow - Verificação imediata"

[rate_limit_exceeded]
description = "Aviso de limite de taxa"
other = "⚠️ Limite de taxa excedido. Aguarde um minuto antes de enviar mais comandos."

[unauthorized]
description = "Mensagem de usuário não autorizado"
other = "Você não está autorizado a usar este comando. Entre em contato com o administrador."

[not_authorized_receive]
description = "Não autorizado a receber notificações"
other = "Você pode interagir com o bot, mas você não está autorizado a receber notificações. Para receber notificações de rejeições, entre em contato com o administrador e solicite que seu Chat ID seja adicionado à lista branca.\n\nSeu Chat ID: <code>{{.ChatID}}</code>"

[configure_error]
description = "Erro ao carregar preferências"
other = "Erro ao carregar preferências. Tente novamente."

[unauthorized_config]
description = "Tentativa de configuração não autorizada"
other = "Você não está autorizado a usar este comando. Entre em contato com o administrador."

[preferences_saved]
description = "Confirmação de preferências salvas"
other = "Preferências salvas!"

[check_now_requested]
description = "Solicitação de verificação imediata"
other = "Verificação imediata solicitada. Processando..."

[check_now_unavailable]
