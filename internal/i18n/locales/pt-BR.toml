other = "❌ Configuração cancelada."

[rejections_detected]
description = "Main rejections notification message"
other = "<b>❌ Rejeições Detectadas no Hourglass</b>\n\n<b>{{.Count}}</b> atribuição(ões) rejeitada(s):\n\n{{range .Rejections}}<b>Rejeição #{{.Number}}:</b>\n👤 <b>Quem:</b> {{.Who}}\n📋 <b>Seção:</b> {{.Section}}\n📝 <b>Atribuição:</b> {{.What}}\n📅 <b>Data:</b> {{.When}}\n\n{{end}}"
