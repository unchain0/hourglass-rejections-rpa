[welcome]
description = "Message de bienvenue"
other = "Bienvenue sur le Bot RPA Hourglass !"

[welcome_instructions]
description = "Instructions après le message de bienvenue"
other = "Utilisez /configure pour choisir les sections pour lesquelles vous souhaitez recevoir des notifications.\nUtilisez /status pour voir vos préférences actuelles.\nUtilisez /help pour voir toutes les commandes disponibles.\nUtilisez /language pour changer la langue du bot."

[choose_sections]
description = "Choisir les sections de notification"
other = "Choisissez les sections pour recevoir des notifications :"

[your_preferences]
description = "Préférences actuelles de l'utilisateur"
other = """<b>Vos préférences :</b>

<b>Notifications :</b>{{if eq .NotificationStatus "enabled"}} Activées{{else}} Désactivées{{end}}

<b>Sections :</b>{{range .Sections}}
- {{.Name}} : {{if eq .Status "enabled"}}✅ Activé{{else}}❌ Désactivé{{end}}{{end}}"""

[notifications_enabled]
description = "Notifications activées"
other = "Notifications : Activées"

[notifications_disabled]
description = "Notifications désactivées"
other = "Notifications : Désactivées"

[no_sections_selected]
description = "Message aucune section sélectionnée"
other = "Aucune section sélectionnée. Vous ne recevrez pas de notifications."

[selected_sections]
description = "En-tête de la liste des sections sélectionnées"
other = "Sections sélectionnées :"

[language_select]
description = "Invite de sélection de langue"
other = "Sélectionnez votre langue :"

[language_changed]
description = "Confirmation du changement de langue"
other = "✅ Langue modifiée avec succès !"

[help_commands]
description = "Liste des commandes disponibles"
other = "Commandes disponibles :\n/start - Message de bienvenue\n/configure - Configurer les sections de notification\n/status - Voir les préférences actuelles\n/stats - Voir les statistiques du bot\n/whoami - Voir les détails de votre compte\n/language - Changer la langue\n/help - Afficher ce message\n/checknow - Vérification immédiate"

[rate_limit_exceeded]
description = "Avertissement de limite de requêtes"
other = "⚠️ Limite de requêtes dépassée. Veuillez attendre une minute avant d'envoyer d'autres commandes."

[unauthorized]
description = "Message utilisateur non autorisé"
other = "Vous n'êtes pas autorisé à utiliser cette commande. Contactez l'administrateur."

[not_authorized_receive]
description = "Non autorisé à recevoir des notifications"
other = "Vous pouvez interagir avec le bot, mais vous n'êtes pas autorisé à recevoir des notifications. Pour recevoir les notifications de rejets, contactez l'administrateur et demandez que votre Chat ID soit ajouté à la liste blanche.\n\nVotre Chat ID : <code>{{.ChatID}}</code>"

[configure_error]
description = "Erreur de chargement des préférences"
other = "Erreur lors du chargement des préférences. Veuillez réessayer."

[unauthorized_config]
description = "Tentative de configuration non autorisée"
other = "Vous n'êtes pas autorisé à utiliser cette commande. Contactez l'administrateur."

[preferences_saved]
description = "Confirmation des préférences enregistrées"
other = "Préférences enregistrées !"

[check_now_requested]
