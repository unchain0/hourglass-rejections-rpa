[welcome]
description = "Mensaje de bienvenida"
other = "Bienvenido al Bot RPA Hourglass!"

[welcome_instructions]
description = "Instrucciones después de la bienvenida"
other = "Usa /configure para elegir qué secciones deseas recibir notificaciones.\nUsa /status para ver tus preferencias actuales.\nUsa /help para ver todos los comandos disponibles.\nUsa /language para cambiar el idioma del bot."

[choose_sections]
description = "Elegir secciones para recibir notificaciones"
other = "Elige las secciones para recibir notificaciones:"

[your_preferences]
description = "Preferencias actuales del usuario"
other = """<b>Tus preferencias:</b>

<b>Notificaciones:</b>{{if eq .NotificationStatus "enabled"}} Activadas{{else}} Desactivadas{{end}}

<b>Secciones:</b>{{range .Sections}}
- {{.Name}}: {{if eq .Status "enabled"}}✅ Activado{{else}}❌ Desactivado{{end}}{{end}}"""

[notifications_enabled]
description = "Notificaciones activadas"
other = "Notificaciones: Activadas"

[notifications_disabled]
description = "Notificaciones desactivadas"
other = "Notificaciones: Desactivadas"

[no_sections_selected]
description = "Mensaje sin secciones seleccionadas"
other = "No hay secciones seleccionadas. No recibirás notificaciones."

[selected_sections]
description = "Encabezado para lista de secciones seleccionadas"
other = "Secciones seleccionadas:"

[language_select]
description = "Solicitud de selección de idioma"
other = "Selecciona tu idioma:"

[language_changed]
description = "Confirmación de cambio de idioma"
other = "✅ Idioma cambiado con éxito!"

[help_commands]
description = "Lista de comandos disponibles"
other = "Comandos disponibles:\n/start - Mensaje de bienvenida\n/configure - Configurar secciones de notificación\n/status - Ver preferencias actuales\n/stats - Ver estadísticas del bot\n/whoami - Ver detalles de tu cuenta\n/language - Cambiar idioma\n/help - Mostrar este mensaje\n/checknow - Verificación inmediata"

[rate_limit_exceeded]
description = "Advertencia de límite de solicitudes"
other = "⚠️ Límite de solicitudes excedido. Espera un minuto antes de enviar más comandos."

[unauthorized]
description = "Mensaje de usuario no autorizado"
other = "No estás autorizado para usar este comando. Contacta al administrador."

[not_authorized_receive]
description = "No autorizado para recibir notificaciones"
other = "Puedes interactuar con el bot, pero no estás autorizado para recibir notificaciones. Para recibir notificaciones de rechazos, contacta al administrador y solicita que tu Chat ID sea agregado a la lista blanca.\n\nTu Chat ID: <code>{{.ChatID}}</code>"

[configure_error]
