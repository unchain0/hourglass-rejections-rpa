run:
  timeout: 5m
  go: '1.26'
linters:
  enable-all: true
  disable:
    - depguard  # not needed for this project
linters-settings:
  cyclop:
    max-complexity: 10
    package-average: 10
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  severity: warning
  exclude-rules: []
