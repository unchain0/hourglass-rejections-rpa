version: "2"

run:
  timeout: 5m

linters:
  enable:
    - staticcheck
    - revive
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - gocognit
    - dupl
    - goconst
    - unconvert
    - unparam
    - nakedret
  settings:
    gocognit:
      min-complexity: 25
    errcheck:
      exclude-functions:
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        - io.Copy
        - (io.Closer).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.MkdirAll
        - os.WriteFile
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Sscanf
        - io.ReadAll
        - file.Close
        - resp.Body.Close
        - b.SendMessage
        - b.EditMessageReplyMarkup
        - b.EditMessageText
        - closer.Close
  exclusions:
    presets: []
    rules:
      - text: 'G304:'
        linters:
          - gosec
      - text: 'G112:'
        linters:
          - gosec
      - text: 'G204:'
        linters:
          - gosec
      - text: 'G115:'
        linters:
          - gosec
      - text: 'G104:'
        linters:
          - gosec
      - text: 'G101:'
        linters:
          - gosec
      - path: '(.+)_test\.go'
        linters:
          - dupl
          - errcheck
          - gosec
          - gocognit
          - goconst
          - revive
          - unparam
          - misspell
      - path: 'src/integrations/auth/webauthn/'
        linters:
          - errcheck
          - gosec
          - goconst
          - gocognit
          - dupl
          - revive
          - unparam
          - misspell
      - path: 'src/testutil/'
        linters:
          - revive
      - path: 'src/engines/rejection_cache/'
        linters:
          - revive
      - path: 'src/integrations/config/'
        linters:
          - revive
      - path: 'src/integrations/logger/'
        linters:
          - revive
          - goconst
          - errcheck
          - gosec
      - path: 'src/services/scheduler/'
        linters:
          - revive
          - gocognit
      - path: 'src/integrations/database/preferences/'
        linters:
          - revive
          - errcheck
      - path: 'src/services/notification/'
        linters:
          - errcheck
          - gocognit
          - revive
      - path: 'src/services/bot/'
        linters:
          - errcheck
          - gocognit
          - revive
      - path: 'src/services/hourglass/'
        linters:
          - dupl
          - revive
      - path: 'src/domain_models/'
        linters:
          - revive
      - path: 'src/integrations/monitoring/telemetry/'
        linters:
          - revive
      - path: 'src/integrations/database/preferences/'
        linters:
          - revive
      - path: 'cmd/'
        linters:
          - revive
          - gosec
          - errcheck
          - misspell
