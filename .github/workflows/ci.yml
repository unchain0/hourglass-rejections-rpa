name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - run: golangci-lint run --timeout 5m --config .golangci.yml
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: go vet ./...
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      - run: go test -race -coverprofile=coverage.out ./...
      - run: bash scripts/check-coverage.sh coverage.out 70
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@4c5227b3a7f82bbfb4fd2b3be5ba1818f03a132d # v10.32.0
        with: go-version-file: 'go.mod'
      - run: go mod verify
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@4cb82750b7c86e9e3b9a10b481fc1975ba90de29 # v8.26.0
        env:
          GITLEAKS_LICENSE: # required
