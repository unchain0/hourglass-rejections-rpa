name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto
  GO_VERSION: '1.26'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build binaries
        run: |
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o rpa-linux-amd64 ./cmd/rpa
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o rpa-linux-arm64 ./cmd/rpa
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o rpa-darwin-amd64 ./cmd/rpa
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o rpa-darwin-arm64 ./cmd/rpa
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o rpa-windows-amd64.exe ./cmd/rpa

      - name: Generate checksums
        run: |
          sha256sum rpa-linux-amd64 rpa-linux-arm64 rpa-darwin-amd64 rpa-darwin-arm64 rpa-windows-amd64.exe > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            rpa-linux-amd64
            rpa-linux-arm64
            rpa-darwin-amd64
            rpa-darwin-arm64
            rpa-windows-amd64.exe
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
