[welcome]
description = "Welcome message"
other = "Welcome to Hourglass RPA Bot!"

[welcome_instructions]
description = "Instructions after welcome"
other = "Use /configure to choose which sections you want to receive notifications for.\nUse /status to view your current preferences.\nUse /help to see all available commands.\nUse /language to change the bot language."

[choose_sections]
description = "Choose sections to receive notifications"
other = "Choose sections to receive notifications for:"

[your_preferences]
description = "User's current preferences"
other = """<b>Your preferences:</b>

<b>Notifications:</b>{{if eq .NotificationStatus "enabled"}} Enabled{{else}} Disabled{{end}}

<b>Sections:</b>{{range .Sections}}
- {{.Name}}: {{if eq .Status "enabled"}}✅ Enabled{{else}}❌ Disabled{{end}}{{end}}"""

[notifications_enabled]
description = "Notifications are enabled"
other = "Notifications: Enabled"

[notifications_disabled]
description = "Notifications are disabled"
other = "Notifications: Disabled"

[no_sections_selected]
description = "No sections selected message"
other = "No sections selected. You will not receive notifications."

[selected_sections]
description = "Header for selected sections list"
other = "Selected sections:"

[language_select]
description = "Language selection prompt"
other = "Select your language:"

[language_changed]
description = "Language change confirmation"
other = "✅ Language changed successfully!"

[help_commands]
description = "Available commands list"
other = "Available commands:\n/start - Welcome message\n/configure - Configure notification sections\n/status - View current preferences\n/stats - View bot statistics\n/whoami - View your account details\n/language - Change language\n/help - Show this message\n/checknow - Immediate check\n/allow <chat_id> - Authorize a user (admin only)\n/deny <chat_id> - Revoke a user's access (admin only)\n/users - List authorized users (admin only)"

[admin_only]
description = "Admin-only command warning"
other = "Only the configured administrator can manage users."

[invalid_user_id]
description = "Invalid user ID argument"
other = "Usage: /allow <chat_id> or /deny <chat_id>. The Chat ID must be a positive integer."

[admin_always_authorized]
description = "Administrator authorization warning"
other = "The configured administrator is always authorized."

[user_allowed]
description = "User authorization confirmation"
other = "User {{.ChatID}} is now authorized."

[user_denied]
description = "User authorization removal confirmation"
other = "User {{.ChatID}} is no longer authorized."

[authorized_users]
description = "Authorized users list"
other = "Authorized users: {{.Users}}"

[user_management_error]
description = "User management error"
other = "Unable to update the user authorization. Please try again."

[rate_limit_exceeded]
description = "Rate limit warning"
other = "⚠️ Rate limit exceeded. Please wait a minute before sending more commands."

[unauthorized]
description = "Unauthorized user message"
other = "You are not authorized to use this command. Contact the administrator."

[not_authorized_receive]
description = "Not authorized to receive notifications"
other = "You can interact with the bot, but you are not authorized to receive notifications. To receive rejection notifications, contact the administrator and request that your Chat ID be added to the whitelist.\n\nYour Chat ID: <code>{{.ChatID}}</code>"

[configure_error]
description = "Error loading preferences"
other = "Error loading preferences. Please try again."

[unauthorized_config]
description = "Unauthorized configuration attempt"
other = "You are not authorized to use this command. Contact the administrator."

[preferences_saved]
description = "Preferences saved confirmation"
other = "Preferences saved!"

[check_now_requested]
description = "Check now trigger"
other = "Immediate check requested. Processing..."

[check_now_unavailable]
description = "Check now unavailable"
other = "Manual check not available in bot mode. Use scheduler mode."

[verification_error]
description = "Verification error"
other = "Error during verification: {{.Error}}"

[no_rejections_configured]
description = "No rejections in configured sections"
other = "You don't have any section configured for monitoring."

[no_rejections_found]
description = "No rejections found success"
other = "✅ No rejections found in configured sections."

[rejections_detected_header]
